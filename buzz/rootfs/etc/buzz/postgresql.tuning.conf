# ==============================================================================
# Home Assistant Add-on: Buzz
# PostgreSQL settings for a single-board host sharing RAM with Home Assistant.
# Included from /data/postgres/postgresql.conf by cont-init.d/30-buzz-postgres.sh.
# ==============================================================================

listen_addresses = '127.0.0.1'
port = 5432
unix_socket_directories = '/run/postgresql'

# The relay's pool is capped at BUZZ_DB_POOL_SIZE=8; the rest is headroom for
# buzz-admin and psql. Every backend costs several MB of RSS.
max_connections = 25

shared_buffers = 96MB
effective_cache_size = 512MB
work_mem = 4MB
maintenance_work_mem = 32MB

# Parallel query is not worth the memory or the context switches here.
max_parallel_workers = 0
max_parallel_workers_per_gather = 0
max_parallel_maintenance_workers = 0
autovacuum_max_workers = 1

# Fewer, smaller, compressed WAL writes: the dominant source of flash wear.
wal_compression = on
max_wal_size = 512MB
min_wal_size = 128MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# No replication is used, so no WAL senders are needed.
max_wal_senders = 0
wal_level = replica

random_page_cost = 1.1
log_min_duration_statement = 2000
log_timezone = 'UTC'
timezone = 'UTC'
lc_messages = 'C'
